<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video and Audio-Html</title>
</head>
<body>
    <div>
        <h2>This is a Video</h2>
    <video src="vdo.mp4" width="200" height="150" controls loop poster="img.jpg"></video>
    </div>
    <div>
        <h2>This is aa Audio</h2>
    <audio src="audio.mp3" controls loop></audio>
    </div>
    <div>
        <h2>This is a embbeded  video</h2>
    <!-- svg tag is just like a image tag used to create a high graphics image   -->
     <iframe  src="https://www.youtube.com/embed/XZwBNDGuWGU?si=pUrkoTiGCBod-N-s" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>" 
     </div>
     <!-- iframe tag is used to embbed another existingh website or video in your web page  -->
</body>
</html>
