<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>box model</title>
    <style>
        .box1{
            background-color: blue;
            border: 2px solid black;
            padding: 2px;
            margin: 5px;

        }
        .box2{
            background-color: yellow;
            border: 2px solid black;
            padding: 2px;
            margin: 5px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="box1">
        <h1>This is a Box Model</h1>
    </div>
    <div class="box2">
        <h1>This is another Box</h1>
    </div>

    <!-- concept of margin collapse!! *IMP* -->
     
</body>
</html>
