<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>
    <style>
        .conatiner{
            border:2px solid black;
            height: 50vh;
            width: 80vw;
            margin:0px 80px;
            display: grid;
            grid-template-columns: 100px 120px;
            grid-template-rows: 140px   ;
            
        }
        .items{
            height: 44px;
            width: 44px;
            border: 2px solid green;
            
        }
        .item-1{
            grid-column-start: 1/2;
            grid-column-end: 1/2;
            grid-row-start: 1/2;
            grid-row-end:1/2;
        }
        .item-4{
            grid-column-start: 1/2;
            grid-column-end: 1/2;
            grid-row-start: 1/2;
            grid-row-end:1/2;
            background-color: aqua;
        }
    </style>
</head>
<body>
    <div class="conatiner">
        <div class="items  item-1">1</div>
        <div class="items">2</div>
        <div class="items">3</div>
        <div class="items item-4">4</div>
        <div class="items">5</div>
    </div>
</body>
</html>
