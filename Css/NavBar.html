<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nav Bar design</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        header img{
            width:144px;
        }
        header nav{
            display: flex;
            justify-content: space-between;
            margin: 5px 180px;
            padding: 10px;

        }
        header nav ul{
            display: flex;
            position: relative;
            right:440px;
            top: 10px;
            gap: 20px;
            font-weight: lighter;
            
            
        }
        header nav ul li{
            list-style-type: none;
            
            
        }
        
        
        
    </style>
</head>
<body>
    <header>
        <nav>
            <div><img src="NavImage1.png" alt="img"></div>
            <div>
                <ul>
                    <li>Product </li>
                    <li>Pricing</li>
                    <li>Resources</li>
                    <li>Our company</li>
                    <li><img src="searchimg.png" alt="" height="20" ></li>
                </ul>
            </div>
           
        </nav>
    </header>
    
</body>
</html>
