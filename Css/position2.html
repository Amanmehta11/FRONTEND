<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            border: 2px solid black;
            margin: 4px;
            padding:2px
        }
        .box{
            margin: 0;
            padding: 0;
        }
        .box1{
            position:sticky;
            top: 0px;
            border: 2px solid black;
            height: 50px;
            width: 80vw;
            background-color: aqua;
            margin: 4px;
            list-style-type: none;
        }
        .box2{
            border: 2px solid black;
            height: 600px;
            width: 80vw;
            background-color: chartreuse;
            margin: 4px;
        }
        .box3{
            border: 2px solid black;
            height: 600px;
            width: 80vw;
            background-color: bisque;
            margin: 4px;
        }
        ol{
            display: flex;
            position:relative;
            right:15px;
            
        }
        ol li{
            list-style-type: none;
            padding: 8px;
        }


    </style>
</head>
<body>
      <div class="parent"> 
    <div class="box box1">
        <span style="display: inline;">
        <img src="img.jpg" alt="" height="40">
        
       <ol>
            <li>home</li>
            <li>about</li>
            <li>contact</li>
        </ol>
        </span>
    </div>
    <div class="box box2"></div>
    <div class=" box box3"></div>
    </div>
</body>
</html>
