<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List style</title>
    <style>
      /*nav ul li {
        list-style: devanagari;
        margin: 0;
        padding: auto;;

      nav ul li {
        list-style: none;
        padding: 10px;

        margin: 2px;
      }

  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li>Home</li>
          <li>About</li>
          <li>Help</li>
        </ul>
      </nav>
    </header>
  </body>
</html>
